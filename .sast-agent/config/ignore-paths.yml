version: 1
description: Comprehensive ignore rules for Node.js, JS/TS, Java, and full-stack web SAST reviews.
ignore:
  # 1. Dependencies & Third-Party Code
  - '**/node_modules/**'
  - '**/bower_components/**'
  - '**/vendor/**'

  # 2. Dependency Lockfiles
  - '**/package-lock.json'
  - '**/yarn.lock'
  - '**/pnpm-lock.yaml'
  - '**/npm-shrinkwrap.json'

  # 3. Build Outputs, Transpiled Bundles & Source Maps
  - '**/dist/**'
  - '**/build/**'
  - '**/target/**'
  - '**/out/**'
  - '**/.next/**'
  - '**/.nuxt/**'
  - '**/.svelte-kit/**'
  - '**/.cache/**'
  - '**/generated/**'
  - '**/*.min.js'
  - '**/*.min.css'
  - '**/*.map'

  # 4. Test Suites & Coverage Outputs
  - '**/test/**'
  - '**/tests/**'
  - '**/tst/**'
  - '**/__tests__/**'
  - '**/mock/**'
  - '**/mocks/**'
  - '**/fixtures/**'
  - '**/sample/**'
  - '**/samples/**'
  - '**/demo/**'
  - '**/coverage/**'
  - '**/.nyc_output/**'

  # 5. Linters, Formatters & Tooling Configurations
  - '**/.eslintrc*'
  - '**/eslint.config.js'
  - '**/.prettierrc*'
  - '**/.prettierignore'
  - '**/.editorconfig'
  - '**/.babelrc'
  - '**/tsconfig.tsbuildinfo'

  # 6. IDE, Git & Log Directories
  - '**/.git/**'
  - '**/.idea/**'
  - '**/.vscode/**'
  - '**/logs/**'
  - '**/*.log'

  # 7. Static Assets & Media (Non-Code)
  - '**/*.png'
  - '**/*.jpg'
  - '**/*.jpeg'
  - '**/*.gif'
  - '**/*.svg'
  - '**/*.ico'
  - '**/*.woff'
  - '**/*.woff2'
  - '**/*.ttf'
  - '**/*.eot'

exceptions:
  scan_security_relevant_config: true
  security_relevant_config_hint: Inspect application.yml, application.properties, .env, web.xml, package.json, server.js, and auth/CORS/JWT configs even when located below a config directory.
