version: 1
severity:
  Critical:
    criteria: [unauthenticated remote code execution, authentication bypass with broad impact, arbitrary file read/write of secrets, direct cloud or database compromise]
  High:
    criteria: [SQL/command/XXE/deserialization/SSRF with meaningful reachability, account takeover, privilege escalation, stored XSS in privileged context, high-impact IDOR]
  Medium:
    criteria: [reflected/DOM XSS, CSRF, open redirect, unsafe upload with constrained reachability, weak JWT/session settings, CORS or headers with realistic exploit context]
  Low:
    criteria: [defense-in-depth weakness, limited information exposure, low-impact misconfiguration with strong constraints]
  Informational:
    criteria: [coverage note, hardening recommendation, or candidate lacking exploitability evidence]
confidence:
  High: source and sink are reachable, handler mapping is verified, and no effective control prevents exploitation.
  Medium: likely dataflow and handler are identified but a control, runtime condition, or deployment fact needs confirmation.
  Low: pattern or partial path only; do not count as confirmed.
adjustments:
  increase_for: [unauthenticated, internet_reachable, privileged_action, sensitive_data, cross_tenant_access, reliable_exploit]
  decrease_for: [strong_allowlist, parameterized_sink, context_encoding, effective_authorization, test_only_or_unreachable]
rules:
  - Assign severity from impact and exploitability, not pattern rarity.
  - Keep confidence separate from severity.
  - A secret is higher severity when active, reachable, privileged, or deployed; placeholders and test-only values are not automatically findings.
  - When material facts are unknown, use needs-review and document the missing fact.
