version: 1
description: Full-repository comprehensive scope scanning all source, configuration, template, manifest, and utility files.
source_roots:
  - src
  - app
  - server
  - backend
  - frontend
  - client
  - web
  - api
  - services
include:
  backend: true
  frontend: true
  configuration: true
  dependency_manifests: true
supported_extensions:
  - .java
  - .jsp
  - .xml
  - .properties
  - .yml
  - .yaml
  - .js
  - .jsx
  - .ts
  - .tsx
  - .json
  - .html
discovery_files:
  java: [pom.xml, build.gradle, build.gradle.kts, web.xml]
  node: [package.json, package-lock.json, yarn.lock, pnpm-lock.yaml]
  frontend: [angular.json, vite.config.js, vite.config.ts, next.config.js, nuxt.config.ts]
security_relevant_config: [application.properties, application.yml, application.yaml, web.xml, struts.xml, security.xml, .env, .env.*]
analysis_order:
  - repository-profile
  - technology-detection
  - endpoint-inventory
  - route-to-handler-map
  - authn-authz-model
  - dataflow-map
  - source-to-sink-scan
  - finding-verification
  - final-report
